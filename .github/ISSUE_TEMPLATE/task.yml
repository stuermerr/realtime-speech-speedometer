name: Implementation task
description: Define a bounded technical, documentation, or maintenance task
title: "[Task]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the concrete outcome this task should produce.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link related issues, evidence, or architecture decisions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and dependencies
      description: State non-goals, blockers, and any human-only steps.
